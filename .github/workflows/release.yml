name: Build & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2 (mingw64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure
        run: cmake -B build -G "Ninja"

      - name: Build
        run: cmake --build build

      - name: Stage release folder
        run: |
          mkdir -p dist
          cp build/better-rgb.exe dist/
          [ -f README.md ] && cp README.md dist/ || true
          [ -f LICENSE ] && cp LICENSE dist/ || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: better-rgb-windows
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: better-rgb-windows
          path: dist

      - name: Zip release
        run: |
          cd dist
          zip -r ../better-rgb-${{ github.ref_name }}-win64.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: better-rgb-${{ github.ref_name }}-win64.zip
          generate_release_notes: true